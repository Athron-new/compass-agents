[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-client"
version = "0.1.0"
description = "Thin Python client for COMPASS — agent memory that knows what still holds, no MCP required."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "respx>=0.20",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compass_client"]
